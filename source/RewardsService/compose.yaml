# Local stack for RewardsService:
#   mongodb        - MongoDB database (data persisted in the `data` volume)
#   rewardsservice - the Tornado API on http://localhost:7050
#   init_data      - one-off job that seeds the reward tiers, then exits

services:

  mongodb:
    container_name: mongodb
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - data:/data/db

  rewardsservice:
    build: .
    container_name: rewardsservice
    command: python ./rewardsservice/app.py &
    volumes:
      - .:/code
    ports:
      - "7050:7050"
    depends_on:
      - mongodb
    links:
      - mongodb

  init_data:
    build: .
    command: python load_mongo_data.py
    depends_on:
      - rewardsservice

volumes:
  data:
