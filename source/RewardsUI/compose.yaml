# Runs the Django dashboard on http://localhost:8000/rewards/. Joins the external
# rewardsservice_default network so it can reach the API at http://rewardsservice:7050;
# start RewardsService first.

services:

  web:
    container_name: rewardsui
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    external_links:
      - rewardsservice
    networks:
      - default
      - rewardsservice_default
networks:
  rewardsservice_default:
    external: true
